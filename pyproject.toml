[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-xray-local"
version = "0.1.0"
description = "Local-first folder privacy exposure scanner with masked findings and offline HTML reports."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = ["privacy", "pii", "data-audit", "local-first", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "defusedxml==0.7.1",
  "fastapi==0.139.2",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "python-magic==0.4.27",
  "typer==0.27.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "httpx2==2.9.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-openpyxl==3.1.5.20260518",
]

[project.scripts]
data-xray = "data_xray_local.cli:app"

[project.urls]
Homepage = "https://github.com/KanadeK/data-xray-local"
Documentation = "https://github.com/KanadeK/data-xray-local#readme"
Issues = "https://github.com/KanadeK/data-xray-local/issues"
Source = "https://github.com/KanadeK/data-xray-local"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_xray_local = ["web/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples/synthetic_export"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603"]
"src/data_xray_local/domain/models.py" = ["S105"]
"src/data_xray_local/domain/rules.py" = ["RUF001"]
"src/data_xray_local/reporting.py" = ["E501"]
"tests/*" = ["S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
packages = ["data_xray_local"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "magic", "PIL.*", "uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
markers = [
  "integration: exercises multiple application layers",
  "e2e: exercises a user-facing entry point",
]

[tool.coverage.run]
branch = true
source = ["src/data_xray_local"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
