name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install audit tooling from lock
        run: python -m pip install -r requirements-dev.lock
      - name: Audit locked dependency set
        run: python -m pip_audit -r requirements-dev.lock --strict
      - name: Scan tracked files for credential shapes
        run: python scripts/secret_scan.py

