name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality and package gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install native MIME runtime
        run: sudo apt-get update && sudo apt-get install --yes libmagic1
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Verify source, types, tests, coverage, and distributions
        run: python scripts/verify.py
      - name: Generate real offline demo
        run: python scripts/demo.py
      - name: Assemble and smoke-test release assets
        run: python scripts/package_release.py
      - name: Run the fail-closed release gate
        run: python scripts/release_check.py
      - name: Upload test and demo evidence
        uses: actions/upload-artifact@v7
        with:
          name: linux-verification-evidence
          path: |
            .coverage
            reports/demo/
            dist/
            dist-release/
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Run cross-platform tests
        run: python -m pytest -q -p no:terminalprogress
      - name: Run the bundled demo
        run: python scripts/demo.py
